# ClincClick – container deployment (Phase 10).
#
# LOCAL DEVELOPMENT CONTINUES TO USE the local PostgreSQL server managed via
# pgAdmin 4 (see README.md). This compose file uses configuration profiles so
# that the local database is still the default; an internal containerized DB is
# available only through an explicit opt-in profile for reproducible installs.
#
#   Default (uses your local PostgreSQL):
#       docker compose up --build
#
#   Optional fully-containerized database (development/CI only):
#       docker compose --profile container-db up --build
#
# Configuration comes exclusively from environment variables / .env.docker .

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clinclick-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: ./.env.docker
        required: false
    environment:
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:YOUR_PASSWORD@host.docker.internal:5432/service_booking_db}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/db')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: clinclick-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: only started with --profile container-db
  postgres:
    image: postgres:16-alpine
    profiles: ["container-db"]
    container_name: clinclick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CONTAINER_DB_PASSWORD:-devpassword}
      POSTGRES_DB: service_booking_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
